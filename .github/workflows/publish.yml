name: Publish

on:
  workflow_dispatch:
    inputs:
      app:
        description: Application
        type: choice
        required: true
        default: All
        options:
          - All
          - Player432Hz
          - Converter432Hz
          - PowerliminalsPlayer
          - YangDownloader

      platform:
        description: Platform
        type: choice
        required: true
        default: All
        options:
          - All
          - win-x64
          - win-x86
          - linux-x64
          - linux-arm64
          - macos-x64
          - macos-arm64

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  FORGEJO_REPOSITORY: git@git.hanumaninstitute.com:hanuman/HanumanInstituteApps.git
  SOURCE_DIR: ${{ github.workspace }}/source

jobs:
  prepare:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      version: ${{ steps.meta.outputs.version }}
      matrix: ${{ steps.meta.outputs.matrix }}

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Configure Forgejo SSH
        shell: bash
        env:
          FORGEJO_SSH_KEY: ${{ secrets.FORGEJO_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$FORGEJO_SSH_KEY" > ~/.ssh/forgejo_key
          chmod 600 ~/.ssh/forgejo_key

          ssh-keyscan -H git.hanumaninstitute.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Checkout Forgejo source
        shell: bash
        env:
          SOURCE_DIR: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail

          GIT_SSH_COMMAND='ssh -i ~/.ssh/forgejo_key -o IdentitiesOnly=yes' \
            git clone \
              --depth 1 \
              "$FORGEJO_REPOSITORY" \
              "$SOURCE_DIR"

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          REQUESTED_APP: ${{ inputs.app }}
          REQUESTED_PLATFORM: ${{ inputs.platform }}
          SOURCE_DIR: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail

          readonly APPS=(
            Player432Hz
            Converter432Hz
            PowerliminalsPlayer
            YangDownloader
          )

          readonly PLATFORMS=(
            win-x64
            win-x86
            linux-x64
            linux-arm64
            macos-x64
            macos-arm64
          )

          if [[ "$REQUESTED_APP" == "All" ]]; then
            apps=("${APPS[@]}")
          else
            apps=("$REQUESTED_APP")
          fi

          if [[ "$REQUESTED_PLATFORM" == "All" ]]; then
            platforms=("${PLATFORMS[@]}")
          else
            platforms=("$REQUESTED_PLATFORM")
          fi

          props="$SOURCE_DIR/Src/Directory.Build.props"

          if [[ ! -f "$props" ]]; then
            echo "::error::Missing $props"
            exit 1
          fi

          version=$(
            sed -n \
              's/.*<AssemblyVersion>\([^<]*\)<\/AssemblyVersion>.*/\1/p' \
              "$props" |
            head -n 1
          )

          if [[ -z "$version" ]]; then
            echo "::error::AssemblyVersion was not found in $props"
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Invalid AssemblyVersion: $version"
            exit 1
          fi

          app_json=$(
            printf '%s\n' "${apps[@]}" |
            jq -R . |
            jq -sc .
          )

          platform_json=$(
            printf '%s\n' "${platforms[@]}" |
            jq -R . |
            jq -sc .
          )

          matrix=$(
            jq -cn \
              --argjson apps "$app_json" \
              --argjson platforms "$platform_json" '
              {
                include: [
                  $apps[] as $app |
                  $platforms[] as $platform |
                  {
                    app: $app,
                    platform: $platform,

                    runner:
                      (
                        if ($platform | startswith("win-"))
                        then "windows-latest"
                        elif ($platform | startswith("linux-"))
                        then "ubuntu-latest"
                        else "macos-latest"
                        end
                      ),

                    runtime:
                      (
                        if $platform == "macos-x64"
                        then "osx-x64"
                        elif $platform == "macos-arm64"
                        then "osx-arm64"
                        else $platform
                        end
                      )
                  }
                ]
              }'
          )

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          echo "Version: $version"
          echo "Applications: ${apps[*]}"
          echo "Platforms: ${platforms[*]}"

  publish:
    needs: prepare

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read

    env:
      PUBLISH_OUT: ${{ github.workspace }}/artifacts
      SOURCE_DIR: ${{ github.workspace }}/source

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Configure Forgejo SSH
        shell: bash
        env:
          FORGEJO_SSH_KEY: ${{ secrets.FORGEJO_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$FORGEJO_SSH_KEY" > ~/.ssh/forgejo_key
          chmod 600 ~/.ssh/forgejo_key

          ssh-keyscan -H git.hanumaninstitute.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Checkout Forgejo source
        shell: bash
        env:
          SOURCE_DIR: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail

          GIT_SSH_COMMAND='ssh -i ~/.ssh/forgejo_key -o IdentitiesOnly=yes' \
            git clone \
              --depth 1 \
              "$FORGEJO_REPOSITORY" \
              "$SOURCE_DIR"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Inno Setup
        if: startsWith(matrix.platform, 'win-')
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Install Linux packaging tools
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          set -euo pipefail

          dotnet tool install --global kuiperzone.pupnet
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

          mkdir -p "$HOME/.local/bin"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --output "$HOME/.local/bin/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"

          chmod +x "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Publish
        shell: bash
        env:
          APP: ${{ matrix.app }}
          PLATFORM: ${{ matrix.platform }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail

          case "$PLATFORM" in
            win-x64|win-x86)
              Publish/workflows/publish-win "$APP" "$RUNTIME"
              ;;

            linux-x64|linux-arm64)
              Publish/workflows/publish-linux "$APP" "$RUNTIME"
              ;;

            macos-x64|macos-arm64)
              Publish/workflows/publish-osx "$APP" "$RUNTIME"
              ;;

            *)
              echo "::error::Unsupported platform: $PLATFORM"
              exit 1
              ;;
          esac

      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(artifacts/*)

          if (( ${#files[@]} != 1 )); then
            echo "::error::Expected exactly one artifact, found ${#files[@]}"
            printf '%s\n' "${files[@]}"
            exit 1
          fi

          [[ -s "${files[0]}" ]]

          echo "Artifact: ${files[0]}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs:
      - prepare
      - publish

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download published artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-*'
          path: artifacts
          merge-multiple: true

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(artifacts/*)

          if (( ${#files[@]} == 0 )); then
            echo "::error::No release artifacts were downloaded"
            exit 1
          fi

          printf 'Release artifact: %s\n' "${files[@]}"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          draft: true
          files: artifacts/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
