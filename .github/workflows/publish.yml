name: Publish

on:
  workflow_dispatch:
    inputs:
      app:
        description: Application
        type: choice
        required: true
        options:
          - All
          - Player432Hz
          - Converter432Hz
          - PowerliminalsPlayer
          - YangDownloader

      platform:
        description: Platform
        type: choice
        required: true
        options:
          - All
          - win-x64
          - win-x86
          - linux-x64
          - linux-arm64
          - macos-x64

jobs:
  # -------------------------------------------------
  # 1. Extract version once
  # -------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.getver.outputs.version }}
    steps:
      - name: Checkout from Forgejo
        run: |
          git clone --depth 1 \
            https://x-access-token:${{ secrets.FORGEJO_TOKEN }}@git.hanumaninstitute.com/hanuman/HanumanInstituteApps.git .

      - name: Get version
        id: getver
        run: |
          VERSION=$(grep -oP '(?<=<AssemblyVersion>)[^<]+' Src/Directory.Build.props | head -1)
          if [ -z "$VERSION" ]; then
            echo "Could not find AssemblyVersion"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

  # -------------------------------------------------
  # 2. Matrix build
  # -------------------------------------------------
  publish:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        app:
          - Player432Hz
          - Converter432Hz
          - PowerliminalsPlayer
          - YangDownloader
        platform:
          - win-x64
          - win-x86
          - linux-x64
          - linux-arm64
          - macos-x64

    runs-on: ${{ startsWith(matrix.platform, 'win') && 'windows-latest' || startsWith(matrix.platform, 'linux') && 'ubuntu-latest' || 'macos-latest' }}

    steps:
      - name: Check if this combination should run
        id: should-run
        run: |
          if [[ "${{ inputs.app }}" == "All" || "${{ inputs.app }}" == "${{ matrix.app }}" ]] && \
             [[ "${{ inputs.platform }}" == "All" || "${{ inputs.platform }}" == "${{ matrix.platform }}" ]]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Skip
        if: steps.should-run.outputs.run != 'true'
        run: echo "Skipping ${{ matrix.app }} / ${{ matrix.platform }}"

      - name: Checkout from Forgejo
        if: steps.should-run.outputs.run == 'true'
        run: |
          git clone --depth 1 \
            https://x-access-token:${{ secrets.FORGEJO_TOKEN }}@git.hanumaninstitute.com/hanuman/HanumanInstituteApps.git .

      - uses: actions/setup-dotnet@v4
        if: steps.should-run.outputs.run == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Install PupNet
        if: steps.should-run.outputs.run == 'true' && startsWith(matrix.platform, 'linux-')
        run: |
          dotnet tool install -g PupNet
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Publish
        if: steps.should-run.outputs.run == 'true'
        env:
          SCRIPT: ${{ startsWith(matrix.platform, 'win') && 'publish-win' || startsWith(matrix.platform, 'linux') && 'publish-linux' || 'publish-macos' }}
          RID: ${{ matrix.platform == 'macos-x64' && 'osx-x64' || matrix.platform }}
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cmd /c "Scripts\%SCRIPT%.bat ${{ matrix.app }} %RID%"
          else
            chmod +x "Scripts/$SCRIPT"
            ./"Scripts/$SCRIPT" "${{ matrix.app }}" "$RID"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.should-run.outputs.run == 'true'
        with:
          name: ${{ matrix.app }}-${{ matrix.platform }}
          path: Publish/**
          if-no-files-found: ignore

  # -------------------------------------------------
  # 3. Create Draft Release with version tag
  # -------------------------------------------------
  release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          draft: true
          files: artifacts/**/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
