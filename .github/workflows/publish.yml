name: Publish

on:
  workflow_dispatch:
    inputs:
      app:
        description: Application
        type: choice
        required: true
        default: All
        options:
          - All
          - Player432Hz
          - Converter432Hz
          - PowerliminalsPlayer
          - YangDownloader
      platform:
        description: Platform
        type: choice
        required: true
        default: All
        options:
          - All
          - win-x64
          - win-x86
          - linux-x64
          - linux-arm64
          - macos-x64

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and matrix
        id: meta
        env:
          APP: ${{ inputs.app }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*<AssemblyVersion>\([^<]*\)<\/AssemblyVersion>.*/\1/p' Src/Directory.Build.props | head -n 1)
          if [ -z "$version" ]; then
            echo "Could not find AssemblyVersion"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Detected version: $version"

          apps='["Player432Hz","Converter432Hz","PowerliminalsPlayer","YangDownloader"]'
          platforms='["win-x64","win-x86","linux-x64","linux-arm64","macos-x64"]'
          if [ "$APP" != All ]; then
            apps=$(jq -cn --arg a "$APP" '[$a]')
          fi
          if [ "$PLATFORM" != All ]; then
            platforms=$(jq -cn --arg p "$PLATFORM" '[$p]')
          fi
          matrix=$(jq -cn --argjson app "$apps" --argjson platform "$platforms" '{app:$app,platform:$platform}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ startsWith(matrix.platform, 'win') && 'windows-latest' || startsWith(matrix.platform, 'linux') && 'ubuntu-latest' || 'macos-latest' }}
    env:
      PUBLISH_OUT: ${{ github.workspace }}/artifacts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install PupNet
        if: startsWith(matrix.platform, 'linux')
        run: |
          dotnet tool install -g kuiperzone.pupnet
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Install appimagetool
        if: startsWith(matrix.platform, 'linux')
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Publish
        shell: bash
        env:
          RID: ${{ matrix.platform == 'macos-x64' && 'osx-x64' || matrix.platform }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == win-* ]]; then
            script=publish-win
          elif [[ "${{ matrix.platform }}" == linux-* ]]; then
            script=publish-linux
          else
            script=publish-osx
          fi
          chmod +x Publish/workflows/publish-linux Publish/workflows/publish-osx Publish/workflows/publish-win
          "./Publish/workflows/$script" "${{ matrix.app }}" "$RID"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          draft: true
          files: artifacts/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
