name: Test Forgejo Access

on:
  workflow_dispatch:

jobs:
  test-forgejo:
    runs-on: ubuntu-latest

    steps:
      - name: Configure Forgejo SSH
        shell: bash
        env:
          FORGEJO_SSH_KEY: ${{ secrets.FORGEJO_SSH_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$FORGEJO_SSH_KEY" ]]; then
            echo "::error::FORGEJO_SSH_KEY is empty."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$FORGEJO_SSH_KEY" \
            > "$HOME/.ssh/forgejo_deploy_key"

          chmod 600 "$HOME/.ssh/forgejo_deploy_key"

          echo "Private key type:"
          ssh-keygen -lf "$HOME/.ssh/forgejo_deploy_key"

          echo "Deriving public key..."

          ssh-keygen \
            -y \
            -f "$HOME/.ssh/forgejo_deploy_key" \
            > "$HOME/.ssh/forgejo_deploy_key.pub"

          echo "Public key fingerprint:"
          ssh-keygen -lf "$HOME/.ssh/forgejo_deploy_key.pub"

          echo "Public key:"
          cat "$HOME/.ssh/forgejo_deploy_key.pub"

          echo "Scanning Forgejo host key..."

          ssh-keyscan \
            -H \
            git.hanumaninstitute.com \
            >> "$HOME/.ssh/known_hosts"

          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Test Forgejo SSH authentication
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -vvv \
            -i "$HOME/.ssh/forgejo_deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            git@git.hanumaninstitute.com \
            2>&1 | tee "$RUNNER_TEMP/forgejo-ssh.log"

      - name: Test Forgejo repository
        shell: bash
        run: |
          set -euo pipefail

          GIT_SSH_COMMAND="ssh \
            -i $HOME/.ssh/forgejo_deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes" \
          git ls-remote \
            git@git.hanumaninstitute.com:hanuman/HanumanInstituteApps.git
